<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym Tracker - Blue Neon Edition</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d1117">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500'%3E%3Crect width='500' height='500' fill='%230d1117'/%3E%3Ccircle cx='250' cy='210' r='160' fill='none' stroke='%2300f3ff' stroke-width='12' filter='drop-shadow(0 0 15px %2300f3ff)'/%3E%3Cpath d='M130 210h60v-40h20v80h-20v-40h-60zM310 210h60v-40h20v80h-20v-40h-60zM190 190h120v40H190z' fill='%23ffffff' filter='drop-shadow(0 0 10px %2300f3ff)'/%3E%3Ctext x='250' y='415' font-family='Arial, sans-serif' font-weight='bold' font-size='38' fill='%23ffffff' text-anchor='middle' letter-spacing='4'%3EGYM%3C/text%3E%3Ctext x='250' y='460' font-family='Arial, sans-serif' font-weight='bold' font-size='30' fill='%2300f3ff' text-anchor='middle' letter-spacing='6'%3ETRACKER%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .neon-border { border: 1px solid rgba(0, 243, 255, 0.4); box-shadow: 0 0 15px rgba(0, 243, 255, 0.15); }
        .neon-glow { text-shadow: 0 0 10px rgba(0, 243, 255, 0.6); }
        .neon-btn { background: linear-gradient(135deg, #00f3ff 0%, #0066ff 100%); color: #0b0f19; font-weight: 700; box-shadow: 0 0 20px rgba(0, 243, 255, 0.4); }
        .neon-btn:active { transform: scale(0.98); }
        .custom-scrollbar::-webkit-scrollbar { height: 4px; width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #00f3ff; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen pb-24 select-none">

    <!-- PANTALLA DE BLOQUEO / LICENCIA -->
    <div id="licenseScreen" class="fixed inset-0 z-50 bg-[#0b0f19] flex items-center justify-center p-4 hidden">
        <div class="bg-[#131b2e] border border-cyan-500/30 rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-5">
            <div class="text-center space-y-2">
                <div class="inline-flex p-4 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-3xl mb-1 shadow-[0_0_20px_rgba(0,243,255,0.2)]">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-wider text-white">GYM TRACKER</h1>
                <p class="text-xs text-slate-400">Software Profesional Protegido por Licencia</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Correo Electrónico Registrado</label>
                    <input type="email" id="licenseEmail" placeholder="tucorreo@gmail.com" class="w-full bg-[#0b0f19] border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:border-cyan-400 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Clave de Activación (16 dígitos)</label>
                    <input type="text" id="licenseKeyInput" placeholder="XXXX-XXXX-XXXX-XXXX" class="w-full bg-[#0b0f19] border border-slate-700 rounded-xl px-4 py-3 text-sm text-white uppercase font-mono tracking-wider focus:border-cyan-400 outline-none">
                </div>
                <button onclick="activateApp()" class="w-full py-3.5 rounded-xl neon-btn text-sm tracking-wider uppercase transition-all">Activar Licencia</button>
                <p id="licenseError" class="text-xs text-red-400 text-center hidden">Clave incorrecta o correo inválido.</p>
            </div>
        </div>
    </div>

    <!-- HEADER / BARRA SUPERIOR -->
    <header class="sticky top-0 z-40 bg-[#0b0f19]/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-cyan-500/10 border border-cyan-400/40 flex items-center justify-center shadow-[0_0_10px_rgba(0,243,255,0.3)]">
                <i class="fa-solid fa-bolt text-cyan-400"></i>
            </div>
            <div>
                <h1 id="appTitleDisplay" class="font-bold text-sm tracking-wide text-white">GYM TRACKER</h1>
                <span class="text-[10px] text-cyan-400 font-medium">BLUE NEON EDITION</span>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openToolsModal()" class="bg-[#131b2e] border border-slate-700 text-cyan-400 px-3 py-2 rounded-xl text-xs font-semibold hover:border-cyan-400 transition">
                <i class="fa-solid fa-calculator mr-1"></i> Herramientas
            </button>
            <button onclick="openTemplateModal()" class="bg-[#131b2e] border border-slate-700 text-emerald-400 px-3 py-2 rounded-xl text-xs font-semibold hover:border-emerald-400 transition">
                <i class="fa-solid fa-file-arrow-down mr-1"></i> Plantillas
            </button>
        </div>
    </header>

    <!-- DASHBOARD DE ESTADÍSTICAS Y RACHA -->
    <section class="px-4 mt-4">
        <div class="grid grid-cols-3 gap-2 bg-[#131b2e] border border-slate-800 rounded-2xl p-3 text-center shadow-lg">
            <div>
                <span class="block text-[10px] uppercase text-slate-400 font-semibold">Volumen Total</span>
                <span id="statVolume" class="text-sm font-bold text-cyan-400">0 kg</span>
            </div>
            <div class="border-x border-slate-800">
                <span class="block text-[10px] uppercase text-slate-400 font-semibold">Series</span>
                <span id="statSets" class="text-sm font-bold text-white">0</span>
            </div>
            <div>
                <span class="block text-[10px] uppercase text-slate-400 font-semibold">Racha / Streak</span>
                <span id="statStreak" class="text-sm font-bold text-orange-400">🔥 0 días</span>
            </div>
        </div>
    </section>

    <!-- NAVEGACIÓN DE LOS 7 DÍAS DE LA SEMANA -->
    <nav class="mt-4 px-4">
        <div id="daysContainer" class="flex space-x-2 overflow-x-auto custom-scrollbar pb-2"></div>
    </nav>

    <!-- CONTENIDO PRINCIPAL DE ENTRENAMIENTO -->
    <main class="px-4 mt-4 max-w-2xl mx-auto space-y-4">
        <div class="flex items-center justify-between bg-[#131b2e]/60 p-3 rounded-xl border border-slate-800">
            <div>
                <h2 id="currentDayTitle" class="font-bold text-base text-white">Lunes</h2>
                <p id="currentDaySubtitle" class="text-xs text-slate-400">Registra tus ejercicios y marcas</p>
            </div>
            <div class="flex space-x-2">
                <button onclick="openDayTypeModal()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300 font-medium transition">
                    <i class="fa-solid fa-list-check mr-1"></i> Tipo de Día
                </button>
                <button onclick="openExerciseModal()" class="neon-btn px-3.5 py-1.5 rounded-lg text-xs tracking-wide">
                    <i class="fa-solid fa-plus mr-1"></i> Ejercicio
                </button>
            </div>
        </div>

        <!-- LISTA DE EJERCICIOS DEL DÍA -->
        <div id="exerciseList" class="space-y-4"></div>
    </main>

    <!-- WIDGET FLOTANTE: TEMPORIZADOR DE DESCANSO -->
    <div id="restTimerWidget" class="fixed bottom-4 left-4 z-40 bg-[#131b2e] border border-cyan-500/50 rounded-2xl p-3 shadow-2xl flex items-center space-x-3 backdrop-blur-md">
        <div class="w-10 h-10 rounded-xl bg-cyan-500/10 flex items-center justify-center text-cyan-400 text-lg font-bold" id="timerDisplay">
            00
        </div>
        <div>
            <span class="block text-[10px] uppercase font-bold text-slate-400">Descanso</span>
            <div class="flex space-x-1 mt-1">
                <button onclick="startTimer(30)" class="bg-slate-800 text-[10px] px-2 py-0.5 rounded text-cyan-300 hover:bg-cyan-500/20">30s</button>
                <button onclick="startTimer(60)" class="bg-slate-800 text-[10px] px-2 py-0.5 rounded text-cyan-300 hover:bg-cyan-500/20">60s</button>
                <button onclick="startTimer(90)" class="bg-slate-800 text-[10px] px-2 py-0.5 rounded text-cyan-300 hover:bg-cyan-500/20">90s</button>
                <button onclick="stopTimer()" class="bg-red-500/20 text-red-400 text-[10px] px-2 py-0.5 rounded"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
    </div>

    <!-- MODAL: AGREGAR / EDITAR EJERCICIO -->
    <div id="exerciseModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-[#131b2e] border border-slate-700 rounded-2xl p-5 w-full max-w-lg space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div class="flex justify-between items-center pb-2 border-b border-slate-800">
                <h3 id="modalExerciseTitle" class="font-bold text-base text-white">Configuración del Ejercicio</h3>
                <button onclick="closeExerciseModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Ejercicio Principal *</label>
                        <input type="text" id="exName" placeholder="Ej: Press de Banca Plano" class="w-full bg-[#0b0f19] border border-slate-700 rounded-xl p-3 text-xs text-white focus:border-cyan-400 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Link YouTube Principal</label>
                        <input type="url" id="exYT1" placeholder="https://youtube.com/..." class="w-full bg-[#0b0f19] border border-slate-700 rounded-xl p-3 text-xs text-white focus:border-cyan-400 outline-none">
                    </div>
                </div>
